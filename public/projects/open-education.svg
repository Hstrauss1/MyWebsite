<svg width="336" height="155" viewBox="0 0 336 155" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="336" height="155" fill="#f5eff0"/>

  <!-- Logo icon - rounded square with gradient -->
  <defs>
    <linearGradient id="oeGrad" x1="108" y1="27" x2="148" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b08a9a"/>
      <stop offset="100%" stop-color="#c9a0a0"/>
    </linearGradient>
  </defs>
  <rect x="108" y="27" width="70" height="70" rx="16" fill="url(#oeGrad)"/>

  <!-- "OE" text inside icon -->
  <text x="143" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">OE</text>

  <!-- "OpenEducation" label -->
  <text x="185" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#b08a9a" text-anchor="start" dominant-baseline="middle" opacity="0.85">Open</text>
  <text x="185" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#b08a9a" text-anchor="start" dominant-baseline="middle" opacity="0.85">Education</text>
</svg>
